# CSS units: each rule set, named by its selector list; at-rules with a block (@media, @supports,
# @keyframes, @font-face, @layer, @container, @page, …) are units that contain theirs. @import and
# @charset have no block and land in Other changes.
id: css-rule
language: Css
rule:
  kind: rule_set
  has: { kind: selectors, pattern: $NAME }
---
id: css-rule.at
language: Css
rule:
  any:
    - kind: media_statement
    - kind: supports_statement
    - kind: keyframes_statement
    - kind: at_rule
      has: { kind: block }
