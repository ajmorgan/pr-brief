# a method inside a block — an anonymous class or a local class within another method — is part of
# that enclosing method (spec §8.2), not a unit of its own
id: java-method
language: Java
rule:
  kind: method_declaration
  all:
    - has:
        field: name
        pattern: $NAME
    - not: { inside: { kind: block, stopBy: end } }
