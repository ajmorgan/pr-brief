id: sh-function
language: Bash
rule:
  kind: function_definition
  has: { field: name, pattern: $NAME }
---
# a top-level variable: configuration at the head of a script
id: sh-const
language: Bash
rule:
  kind: variable_assignment
  all:
    - inside:
        any:
          - kind: program
          - kind: declaration_command # export X=…, readonly X=…, declare -r X=…
            inside: { kind: program }
    - has: { field: name, pattern: $NAME }
